name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test suite
        run: python -m unittest discover -s tests -v
      - name: Lint installer scripts
        run: shellcheck -S warning install.sh uninstall.sh
      - name: Verify systemd unit
        run: |
          sed "s#/usr/local/bin/usb-snitch#$PWD/usb-snitch.py#" usb-snitch.service > /tmp/usb-snitch.service
          systemd-analyze verify /tmp/usb-snitch.service
      - name: Smoke test
        run: |
          python usb-snitch.py --version
          python usb-snitch.py --list --json
